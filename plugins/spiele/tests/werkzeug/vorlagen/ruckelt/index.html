<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funken</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f1a; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<!-- Vorlage für den Testfall ruckelt-am-handy: Die Ruckel-Ursache ist absichtlich eingebaut (shadowBlur je Funke im Loop). -->
<canvas id="feld" aria-label="Spielfeld"></canvas>
<script>
const TUNE = { funkenJeTipp: { value: 60, min: 10, max: 120, step: 10 }, schwerkraft: { value: 0.15, min: 0, max: 0.5, step: 0.05 } };
const c = document.getElementById("feld"), g = c.getContext("2d");
let funken = [], punkte = 0, ziel = { x: 0.5, y: 0.3, r: 40 };
function groesse() { c.width = c.clientWidth; c.height = c.clientHeight; }
addEventListener("resize", groesse); groesse();
function spruehen(x, y) {
  for (let i = 0; i < TUNE.funkenJeTipp.value; i++) {
    const w = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6;
    funken.push({ x, y, vx: Math.cos(w) * v, vy: Math.sin(w) * v - 3, leben: 90, farbe: `hsl(${30 + Math.random() * 30},100%,60%)` });
  }
}
c.addEventListener("pointerdown", (e) => { const r = c.getBoundingClientRect(); spruehen(e.clientX - r.left, e.clientY - r.top); });
setInterval(() => spruehen(c.width * Math.random(), c.height * 0.8), 120);
function bild() {
  g.fillStyle = "rgba(11,15,26,0.35)"; g.fillRect(0, 0, c.width, c.height);
  g.beginPath(); g.strokeStyle = "#5cf"; g.lineWidth = 4; g.arc(ziel.x * c.width, ziel.y * c.height, ziel.r, 0, 7); g.stroke();
  for (const f of funken) {
    f.vy += TUNE.schwerkraft.value; f.x += f.vx; f.y += f.vy; f.leben--;
    if (Math.hypot(f.x - ziel.x * c.width, f.y - ziel.y * c.height) < ziel.r) { punkte++; f.leben = 0; }
    g.shadowBlur = 24; g.shadowColor = f.farbe;          // teuer: Weichzeichner für jeden einzelnen Funken
    g.fillStyle = f.farbe; g.beginPath(); g.arc(f.x, f.y, 3, 0, 7); g.fill();
  }
  g.shadowBlur = 0;
  funken = funken.filter((f) => f.leben > 0);
  g.fillStyle = "#fff"; g.font = "20px sans-serif"; g.fillText(punkte + " Funken im Ring", 16, 32);
  requestAnimationFrame(bild);
}
requestAnimationFrame(bild);
</script>
</body>
</html>
